name: Validate profile bot commit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-profile-bot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the candidate commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Verify the candidate profile manifest
        id: candidate
        shell: bash
        run: |
          set -euo pipefail

          branch="${GITHUB_REF_NAME}"
          legacy_remainder="${branch#bot/profile/}"
          batch_remainder="${branch#bot/profile-batch/}"
          legacy_pattern='^([a-z0-9]+(-[a-z0-9]+)*)/([A-Za-z0-9][A-Za-z0-9_-]{0,127})/a([1-2])$'
          batch_pattern='^([0-9a-f]{24})/([0-9a-f]{64})/a([1-2])$'
          mode=''
          expected_slug=''
          expected_manifest=''

          if [[ "${branch}" != "${legacy_remainder}" && "${legacy_remainder}" =~ ${legacy_pattern} ]]; then
            mode='legacy'
            expected_slug="${BASH_REMATCH[1]}"
          elif [[ "${branch}" != "${batch_remainder}" && "${batch_remainder}" =~ ${batch_pattern} ]]; then
            mode='batch'
            expected_manifest="${BASH_REMATCH[2]}"
          else
            echo "Invalid profile bot branch: ${branch}" >&2
            exit 1
          fi

          parent_count="$(git rev-list --parents -n 1 HEAD | awk '{ print NF - 1 }')"
          if [[ "${parent_count}" != "1" ]]; then
            echo "Profile bot commits must have exactly one parent." >&2
            exit 1
          fi

          changed_count=0
          manifest_file="$(mktemp)"
          declare -A changed_slugs=()

          while IFS=$'\t' read -r status path; do
            [[ -n "${path}" ]] || continue
            changed_count=$((changed_count + 1))

            path_pattern='^src/data/members/([a-z0-9]+(-[a-z0-9]+)*)\.(json|webp)$'
            if [[ ! "${path}" =~ ${path_pattern} ]]; then
              echo "Unexpected profile bot path: ${path}" >&2
              exit 1
            fi
            slug="${BASH_REMATCH[1]}"
            extension="${BASH_REMATCH[3]}"

            if [[ "${mode}" == 'legacy' && "${slug}" != "${expected_slug}" ]]; then
              echo "Legacy profile branch changed another slug: ${path}" >&2
              exit 1
            fi

            if [[ "${status}" != "A" && "${status}" != "M" && "${status}" != "D" ]]; then
              echo "Unexpected profile bot change status ${status}: ${path}" >&2
              exit 1
            fi

            if [[ "${extension}" == 'json' && "${status}" == "D" ]]; then
              echo "Profile bot commits may not delete ${path}." >&2
              exit 1
            fi

            changed_slugs["${slug}"]=1
            printf '%s\t%s\n' "${status}" "${path}" >> "${manifest_file}"
          done < <(git diff-tree --no-commit-id --name-status --no-renames -r HEAD^ HEAD)

          slug_count="${#changed_slugs[@]}"
          if (( changed_count < 1 || changed_count > 40 || slug_count < 1 || slug_count > 20 )); then
            echo "Profile bot commits must change at most 20 profiles and 40 allowed files." >&2
            exit 1
          fi

          if [[ "${mode}" == 'legacy' ]] && (( changed_count > 2 || slug_count != 1 )); then
            echo "Legacy profile bot commits must change one or two files for one slug." >&2
            exit 1
          fi

          mapfile -t slugs < <(printf '%s\n' "${!changed_slugs[@]}" | LC_ALL=C sort)
          for slug in "${slugs[@]}"; do
            json_path="src/data/members/${slug}.json"
            if [[ ! -f "${json_path}" ]]; then
              echo "Candidate profile JSON is missing: ${json_path}" >&2
              exit 1
            fi
          done

          if [[ "${mode}" == 'batch' ]]; then
            actual_manifest="$(LC_ALL=C sort "${manifest_file}" | sha256sum | awk '{ print $1 }')"
            if [[ "${actual_manifest}" != "${expected_manifest}" ]]; then
              echo "Profile batch manifest mismatch." >&2
              exit 1
            fi
          fi

          echo "slugs=${slugs[*]}" >> "${GITHUB_OUTPUT}"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            bot/package-lock.json

      - name: Install website dependencies
        run: npm ci

      - name: Install profile bot validation dependencies
        run: npm ci --prefix bot

      - name: Validate member data
        run: npm run validate:profiles

      - name: Validate bot-managed profile and photo relation
        shell: bash
        run: |
          set -euo pipefail
          for slug in ${{ steps.candidate.outputs.slugs }}; do
            node bot/scripts/validate-profile-candidate.mjs "${slug}"
          done

      - name: Build the site
        run: npm run build
