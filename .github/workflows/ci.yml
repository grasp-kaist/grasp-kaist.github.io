name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            bot/package-lock.json

      - name: Install website dependencies
        run: npm ci

      - name: Install bot dependencies
        run: npm ci --prefix bot

      - name: Check the bot
        run: npm run check --prefix bot

      - name: Build the production bot image
        run: docker build --file bot/Dockerfile --tag grasp-profile-bot:test .

      - name: Build the website
        run: npm run build
